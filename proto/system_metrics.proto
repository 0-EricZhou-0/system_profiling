syntax = "proto3";

import "metric_sample.proto";

// CPU + memory trace. SystemProfiler emits one length-delimited
// SystemMetricsTrace per flush. Two scopes appear simultaneously:
//   SCOPE_SYSTEM  — singleton, one Sample per tick. The values[]
//                   array combines CPU utilization + system memory
//                   stats in the order declared by the corresponding
//                   ScopeMetricNames entry.
//   SCOPE_PROCESS — one ProcessSample per tracked PID per tick. The
//                   values[] array combines per-PID CPU + memory.
//
// `tracked_processes` carries TrackedProcessV2 entries; a mid-run
// RemoveTrackedProcess() flips `removed=true` on the next flush
// (the last flush in which the PID still gets a final sample) and
// then drops the entry on subsequent flushes.
message SystemMetricsTrace {
    TraceHeader header                           = 1;
    repeated ScopeMetricNames scope_metric_names = 2;
    repeated TrackedProcessV2 tracked_processes  = 3;
    repeated Sample        system_samples        = 4;
    repeated ProcessSample process_samples       = 5;
    repeated FlushStats    flush_stats           = 6;
}
