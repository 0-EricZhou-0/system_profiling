syntax = "proto3";

import "metric_sample.proto";

// Disk trace — per-device bandwidth + in-flight queue depth plus
// per-PID I/O (the five /proc/<pid>/io byte counters). DiskProfiler emits one length-delimited
// DiskMetricsTrace per flush.
//
// Two scopes appear simultaneously:
//   SCOPE_DEVICE  — one DeviceSample per tracked device per tick.
//                   values[] combines bandwidth + queue-depth.
//   SCOPE_PROCESS — one ProcessSample per tracked PID per tick.
//                   values[] holds the rates of rchar, wchar,
//                   read_bytes, write_bytes and cancelled_write_bytes
//                   (docs/metric-model.md, "Per-PID I/O counters").
//                   A process's samples carry its OWN I/O: the I/O of
//                   tracked children it reaped is subtracted (see
//                   IoReapAdjustment).
message DiskMetricsTrace {
    TraceHeader header                           = 1;
    repeated ScopeMetricNames scope_metric_names = 2;
    repeated TrackedProcessV2 tracked_processes  = 3;
    repeated string  tracked_devices             = 4;
    repeated DeviceSample  device_samples        = 5;
    repeated ProcessSample process_samples       = 6;
    repeated FlushStats    flush_stats           = 7;
    // Present while descendant tracking runs; see DiscoveryStats.
    DiscoveryStats   discovery_stats             = 8;
    // One per parent sample from which reaped tracked children's I/O
    // was subtracted (see IoReapAdjustment).
    repeated IoReapAdjustment io_reap_adjustments = 9;
}

// Same, signed: a difference of two readings.
message IoCounterDeltas {
    sint64 rchar                 = 1;
    sint64 wchar                 = 2;
    sint64 read_bytes            = 3;
    sint64 write_bytes           = 4;
    sint64 cancelled_write_bytes = 5;
}

// When a process reaps a child, the kernel adds the child's lifetime I/O
// to the parent's own /proc/<pid>/io counters (there is no separate
// "children" counter, unlike cutime/cstime for CPU). If both are
// tracked, the child's I/O would be counted twice: in its own samples,
// and again as a jump in the parent's at the reap. So at the parent
// sample that first includes the reap, each reaped child's counters as
// of its last reading are subtracted from the parent's delta, and one
// IoReapAdjustment records it.
//
// Chains. The kernel's reap folds the reaped process's own counters AND
// everything already folded into it (its reaped children, their reaped
// children, ...) into the reaper (kernel/exit.c, wait_task_zombie). So
// when a tracked process P reaps a tracked child C and then exits and is
// reaped by a tracked G before the probe could read P again, G's sample
// holds P's and C's I/O: both are subtracted there, and both are listed
// here, C with reaped_by = P.
//
// Whether P reaped C cannot always be known: if P exited first, C was
// re-parented (to a subreaper or init) and its I/O went there, not into
// P. It is decided like this:
//   * C was reaped by this library's orphan reaper (adopt_orphans()):
//     not in P, not subtracted, not listed;
//   * the orphan reaper runs (adopt_orphans() in the launcher, and
//     descendant tracking on) and C descends from a root the launcher
//     started: an orphan of P would have been adopted and reaped by the
//     launcher, so P reaped C — subtracted;
//   * otherwise: listed with ambiguous = true and NOT subtracted (its
//     I/O is then counted twice if P did reap it: in C's samples, and in
//     G's remainder), and the record has ambiguous = true.
//
// Auto-reaped children. A parent whose SIGCHLD is SIG_IGN (or that set
// SA_NOCLDWAIT) has its children reaped by the kernel at their exit,
// without wait_task_zombie: nothing is folded into it (kernel/signal.c,
// do_notify_parent; kernel/exit.c, exit_notify -> release_task). When a
// watched child's reap is found, its parent's /proc/<pid>/status SigIgn
// mask is read once (never per tick); if SIGCHLD is ignored the child is
// listed with autoreaped = true and NOT subtracted, and the record has
// autoreaped = true. In a chain, a child whose own reaper auto-reaped a
// process on the way up is marked the same way (none of it arrived).
//
// The raw /proc value stays reconstructable: the parent's raw delta over
// that sample's interval is
//     children[*].last_seen (summed over those neither ambiguous nor
//                            autoreaped)  +  remainder
// and `remainder` is exactly what the parent's sample carries (its rates
// times the interval). It mixes the parent's own I/O in that interval
// with the children's I/O after their last reading, which no reading can
// tell apart. A negative remainder would mean the parent's delta was
// smaller than what was subtracted (the sample is then clamped to 0);
// it is not expected. A child's last_seen is its io_before_tracking
// (TrackedProcessV2) plus its samples.
//
// Limits (docs/metric-model.md, "Reaped children's I/O"):
//   * only children that were sampled are subtracted; the I/O of a child
//     the probe never read (untracked, or gone before its first reading)
//     stays in the parent, where it is counted once;
//   * the parent is the one the child had as a zombie (its ppid), or, if
//     it was reaped before the probe could look, the one it was
//     registered with; a parent that is not tracked gets no adjustment;
//   * auto-reaping is detected from SIG_IGN only: SA_NOCLDWAIT does not
//     show in /proc, so a parent that set it with a handler or SIG_DFL
//     still has its auto-reaped children subtracted (the sample is then
//     clamped at 0, the remainder negative). The disposition is read when
//     the reap is found (within a sample interval of it), not at the exit
//     itself; a reaper already gone by then (a chain whose middle process
//     exited in the same interval and was reaped) cannot be read and is
//     treated as having waited;
//   * the reaper rule assumes no process between the launcher and the
//     reaping tracked ancestor is itself a subreaper.
message IoReapAdjustment {
    uint64 timestamp_ns            = 1;  // the parent sample it applies to
    uint32 parent_pid              = 2;
    message Child {
        uint32     pid             = 1;
        IoCounters last_seen       = 2;  // subtracted from the parent, unless ambiguous
        // The process that reaped it: parent_pid, or (a chain) another
        // child listed in this record.
        uint32     reaped_by       = 3;
        // reaped_by exited in the same interval, and whether it reaped
        // this child before exiting is unknown (see above): not subtracted.
        bool       ambiguous       = 4;
        // Auto-reaped (its reaper ignored SIGCHLD) here or on the way up:
        // its I/O never reached parent_pid. Not subtracted.
        bool       autoreaped      = 5;
    }
    repeated Child  children       = 3;
    IoCounterDeltas remainder      = 4;
    bool            ambiguous      = 5;  // some child is ambiguous
    bool            autoreaped     = 6;  // some child is autoreaped
}

