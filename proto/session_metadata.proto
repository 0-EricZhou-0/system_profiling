syntax = "proto3";

import "metric_catalog.proto";

// Session-level manifest. A single SessionMetadata message is written
// (NOT length-delimited) to session_metadata.pb at ProfilerSuite::Start()
// and re-emitted at Stop() (identical except for situation lines about
// roots added mid-run and the current subreaper state). The write is atomic
// (tmp file + rename(2)) so tailers never see a torn file.
//
// Describes what was running and when, so consumers can interpret the
// per-component .pb files in context.

enum ProbeKind {
    PROBE_KIND_UNSPECIFIED = 0;
    PROBE_KIND_GPU = 1;
    PROBE_KIND_SYSTEM = 2;
    PROBE_KIND_DISK = 3;
    PROBE_KIND_EVENTS = 4;
}

message ActiveProbe {
    ProbeKind kind = 1;
    // Relative to the directory holding session_metadata.pb (normally
    // just the file name), so a trace directory can be copied or moved.
    // v0.2.0 and earlier recorded output_dir + output_file (absolute when
    // output_dir was); readers then fall back to the file's name next to
    // session_metadata.pb (tools/trace_paths.py).
    string output_file = 2;
    uint64 sampling_frequency_hz = 3;  // 0 if not applicable (e.g. events)
}

// One line of the startup situation report: what the environment
// allows, observed on the observer side at ProfilerSuite::Configure()
// (plus one line per tracked root, added when the root is added).
// Every line states what the observed value means for the trace.
message SituationCheck {
    string check       = 1;   // e.g. "pidfd_open", "target 1234"
    string observed    = 2;   // e.g. "available", "uid 1000 (same); spawned"
    string consequence = 3;   // what this means for the trace
    bool   degraded    = 4;   // true = a guarantee is weaker than the default
}

message SessionMetadata {
    string hostname = 1;
    uint64 wall_clock_epoch_ns = 2;     // captured at suite Start()
    string start_iso8601 = 3;           // human-display copy of wall-clock
    repeated ActiveProbe probes = 4;

    // The active metric catalog at run time. Inlined so visualizers can
    // read FQN type / unit / peak information without a separate file
    // dependency. Includes both the user-supplied catalog and any
    // GPU-specific descriptors appended at Configure() by walking
    // cuptiProfilerHostGetSubMetrics().
    MetricCatalog catalog = 5;

    // Startup situation report: which tracking guarantees held while
    // this trace was collected. Logged once at Configure(); the
    // subreaper line is refreshed on every write, and per-root lines
    // are appended as roots are added.
    repeated SituationCheck situation = 6;
}
