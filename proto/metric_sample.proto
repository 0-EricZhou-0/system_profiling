syntax = "proto3";

import "metric_catalog.proto";

// Shared substructures for the per-domain *MetricsTrace types.
//
// Each domain trace (GPU / system / disk) declares a per-scope FQN
// registry via `repeated ScopeMetricNames` and emits samples whose
// `values[]` array is ordered to match. The registry is replayed on
// every flush so each trace message is self-contained for mid-stream
// join.

// Per-scope FQN registry. The order of `fqns` defines the column
// order of any same-scope sample's `values[]`.
message ScopeMetricNames {
    Scope scope          = 1;
    repeated string fqns = 2;
}

// Sample for SCOPE_SYSTEM (singleton, no key).
message Sample {
    uint64 timestamp_ns       = 1;
    repeated double values    = 2;
}

// Sample for SCOPE_PROCESS, keyed by PID.
message ProcessSample {
    uint64 timestamp_ns       = 1;
    uint32 pid                = 2;
    repeated double values    = 3;
}

// Sample for SCOPE_DEVICE, keyed by block device name.
message DeviceSample {
    uint64 timestamp_ns       = 1;
    string device_name        = 2;
    repeated double values    = 3;
}

// Sample for SCOPE_GPU, keyed by GPU device index.
message GPUSample {
    uint64 timestamp_ns       = 1;
    uint32 gpu_index          = 2;
    repeated double values    = 3;
}

// One row of the trace's process table: a tracked process, with a
// removal marker. Replayed in every flush while the process is tracked,
// so each flush is self-contained.
//
// Removal: after RemoveTrackedProcess(), or once the probe sees the
// process exit (every tracked PID — listed or discovered, with
// descendant tracking on or off — is watched through a pidfd), the next
// flush emits the entry with removed=true once, then the PID is dropped
// from subsequent flushes. An exited process is never sampled again
// under that entry; a later process that gets the same PID number is a
// different process and appears as a new entry after this one is gone.
//
// Processes found by descendant tracking (ProcessDiscoveryConfig) carry
// discovered=true; listed roots carry discovered=false. Together with
// parent_pid this lets a reader rebuild the tree.
message TrackedProcessV2 {
    uint32 pid        = 1;
    // Display name. Roots: the alias they were listed with. Discovered:
    // "<label>/<comm>", following comm (e.g. "vllm/python3.12" becomes
    // "vllm/VLLM::EngineCor" when the process renames itself). A reader
    // should take the alias of the latest flush, or use comm_history.
    string alias      = 2;
    bool   removed    = 3;
    // The parent the process had when it was registered: for a
    // discovered process, the tracked parent it was found under; for a
    // listed root, its parent at the time it was listed (0 if it did not
    // exist). Not updated on reparenting.
    uint32 parent_pid = 4;
    bool   discovered = 5;   // kind: true = found by descendant tracking, false = listed root
    // System trace, every tracked process (the head): CPU time (ns,
    // process CPU clock) the process had used before its first sample —
    // from its fork until the first reading after it was registered.
    // Recorded once, here, and never folded into a sample, so it cannot
    // show up as a spike in the first interval; the samples count from
    // registration. For a discovered process that is its CPU from fork
    // to discovery; for a root started long before the trace, it is its
    // entire CPU up to attach. A process tracked from its first sample
    // to its exit accounts for cpu_before_tracking_ns + the samples +
    // its CpuTail (system_metrics.proto; discovered processes only).
    // (Named cpu_before_discovery_ns and set for discovered processes
    // only until 2026-09-25.)
    uint64 cpu_before_tracking_ns = 6;
    // Roots: the alias they were listed with. Discovered: the alias of
    // the root they descend from (alias = label + "/" + comm).
    string label      = 7;
    // Current /proc/<pid>/comm (at most 15 characters), re-read every
    // 100 ms, so renames (prctl(PR_SET_NAME), exec) are followed.
    string comm       = 8;
    // When the process started: /proc/<pid>/stat field 22 on the trace
    // clock (the samples' timestamp_ns clock). Kernel-recorded, but in
    // USER_HZ ticks: 10 ms resolution. 0 = unknown.
    uint64 start_time_ns = 9;
    // With removed=true after the process exited: the first instant the
    // probe saw it gone (trace clock). The exit happened at most one
    // sampling tick earlier, and no sample of it is later than this.
    // 0 while alive, and for a process removed by request.
    uint64 end_time_ns   = 10;
    // Every comm the process has had, oldest first, each with the trace
    // time it was first seen (the first entry: at registration; later
    // ones: within 100 ms of the rename). At most 16: the first and the
    // 15 most recent.
    repeated CommChange comm_history = 11;
}

message CommChange {
    uint64 timestamp_ns = 1;
    string comm         = 2;
}

// Descendant tracking's own cost, attached to every system/disk flush
// while discovery runs. Counters and percentiles are cumulative since
// the probe started, so the last flush of a run summarises all of it.
// Percentiles come from a log-linear histogram (1/16-octave buckets,
// <= 6.25% relative error); max is exact.
message DiscoveryStats {
    uint64 scan_interval_ns = 1;   // configured interval
    uint64 scans            = 2;   // scans completed
    uint64 scan_p50_ns      = 3;   // one scan's wall time, observer side
    uint64 scan_p99_ns      = 4;
    uint64 scan_max_ns      = 5;
    uint64 discovered       = 6;   // processes registered by discovery
    uint64 exited           = 7;   // discovered processes seen exiting
    uint64 rejected         = 8;   // PID-reuse guard rejections
}

// GPU device-specific information. Includes peaks that are
// chip-dependent and therefore can't live as constants in the catalog.
// Replayed on every flush (cheap; one entry per active device).
message GPUDeviceInfo {
    uint32 device_index             = 1;
    string device_name              = 2;
    string chip_name                = 3;
    double peak_dram_bw_bytes_per_s = 4;
    double peak_pcie_bw_bytes_per_s = 5;
    double peak_nvlink_bw_bytes_per_s = 6;
    // cudaDeviceProp.maxThreadsPerMultiProcessor / warpSize. The
    // hardware ceiling that "Active Warps / Cycle" panels normalize
    // against — chip-dependent (64 on Volta+/Hopper/Ampere, 32 on
    // Turing).
    uint32 max_warps_per_sm         = 7;
}

// Clock anchors used to convert sample timestamps between domains.
message ClockAnchors {
    uint64 steady_clock_reference_ns = 1;
    uint64 wall_clock_epoch_ns       = 2;
    // GPU-only: CUPTI's own clock domain reference. Zero for non-GPU
    // traces.
    uint64 cupti_reference_ns        = 3;
}

// Common header replicated on every trace message of every domain.
message TraceHeader {
    string hostname              = 1;
    uint64 sampling_frequency_hz = 2;
    // Captured at sample time on the host that's emitting — resolves
    // UNIT_PCT_OF_CORE peaks correctly even when visualized on a
    // different machine.
    uint32 host_cpu_count        = 3;
    ClockAnchors anchors         = 4;
}

// Per-flush diagnostics. Each flush attaches the PREVIOUS flush's
// stats (a flush cannot include its own size).
message FlushStats {
    uint64 flush_byte_size       = 1;
    uint64 flush_interval_ns     = 2;
}
